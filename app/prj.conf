# This file contains selected Kconfig options for the application.


# Enable Logging
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
#CONFIG_UART_CONSOLE=y
# Use the console as the backend for logs
#CONFIG_LOG_BACKEND_UART=y

# Optional: Ensure logs are processed immediately (useful for debugging crashes)
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_GPIO=y

# SPI
CONFIG_SPI=y
#CONFIG_SHELL=y
#CONFIG_SPI_SHELL=y
#CONFIG_GPIO_SHELL=y
# SPI configuration for AS5047P

#CONFIG_SPI_ASYNC=n

# Enable AS5047P driver - not needed at the moment
CONFIG_SENSOR=y
# CONFIG_AS5047P=y

# Enable PWM for LED control
CONFIG_PWM=y

# enable floating point logging
CONFIG_CBPRINTF_FP_SUPPORT=y

# Configuration for stepper motor control
CONFIG_PWM_STM32=y


CONFIG_DAC=y
CONFIG_DAC_STM32=y


CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr USB Console"
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# This ensures the shell uses the USB CDC ACM node


CONFIG_USB_DEVICE_VID=0x2FEED
CONFIG_USB_DEVICE_PID=0x0123
CONFIG_USB_DEVICE_MANUFACTURER="Paul"
CONFIG_USB_DEVICE_PRODUCT="STM32F405 Stepper Controller"